# Temporary: inspects what public Google Drive pages expose without an API key.
name: Probe Drive scraping
on:
  push:
    branches: ["claude/blog-google-docs-workflow-3j19xf"]
    paths: [".github/workflows/probe-drive.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        shell: python
        run: |
          import json, re, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"}
          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, dict(r.headers), r.read().decode("utf-8", "replace")
          folders = ["1KpLl_1tcK0eeehzN980zbG-3M2nhbVks", "1LVNwy88DovNenEQUtCNmiuB6zYnqJXiZ",
                     "1LufWJZBSP-qij-4rC_F8BPpf_JFxW2ku", "1OZ9Z71lHZiCLB3cYU9kXktyYJ8VjSFwX"]
          docs = []
          for fid in folders:
              print("=" * 30, fid)
              try:
                  st, hd, h = get(f"https://drive.google.com/embeddedfolderview?id={fid}")
                  body = re.sub(r"<style.*?</style>|<script.*?</script>", "", h, flags=re.S)
                  print("EMBEDDED", st, len(h), "bytes")
                  print(re.sub(r">\s*<", ">\n<", body)[:3500])
                  docs += re.findall(r"docs\.google\.com/document/d/([-\w]{25,})", h)
              except Exception as e:
                  print("EMBEDDED ERR", e)
              try:
                  st, hd, h = get(f"https://drive.google.com/drive/folders/{fid}")
                  m = re.search(r"_DRIVE_ivd'\] = '((?:[^'\\]|\\.)*)'", h)
                  print("FOLDERPAGE", st, len(h), "bytes, ivd found:", bool(m))
                  if m:
                      arr = json.loads(m.group(1).encode().decode("unicode_escape"))
                      for e in arr[0] or []:
                          print("  ", e[0], repr(e[2]), e[3], "created", e[9], "modified", e[10])
                          if e[3] == "application/vnd.google-apps.document":
                              docs.append(e[0])
              except Exception as e:
                  print("FOLDERPAGE ERR", e)
          print("DOCS FOUND:", docs)
          for d in docs[:2]:
              for fmt in ("md", "txt"):
                  try:
                      st, hd, h = get(f"https://docs.google.com/document/d/{d}/export?format={fmt}")
                      print("EXPORT", d, fmt, st, hd)
                      print(h[:800])
                  except Exception as e:
                      print("EXPORT ERR", d, fmt, e)
