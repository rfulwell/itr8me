# Temporary: dry run of the Google Docs sync against the real folder.
name: Probe Drive sync
on:
  push:
    branches: ["claude/blog-google-docs-workflow-3j19xf"]
    paths: [".github/workflows/probe-drive.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dry-run sync
        env:
          GDRIVE_FOLDER_ID: 1LNY6b8HOyFZ58GWvLnQ8hg7RStqUY-3m
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, ".github/scripts")
          import gdocs_sync as g
          d = g.Drive()
          docs = d.list_docs("1LNY6b8HOyFZ58GWvLnQ8hg7RStqUY-3m")
          for doc in docs:
              print("DOC", doc["id"], repr(doc["name"]), doc["modified"], "draft" if g.is_draft(doc["name"]) else "")
          for doc in docs[:3]:
              print("=" * 20, "EXPORT", doc["name"])
              try:
                  print(d.export_markdown(doc["id"])[:6000])
              except Exception as e:
                  print("EXPORT ERR", e)
          EOF
          python .github/scripts/gdocs_sync.py || echo "SYNC FAILED"
          git status --short
          for f in _posts/gdocs/*.md; do [ -f "$f" ] && { echo "==== $f"; head -c 3000 "$f"; echo; }; done
          ls -R assets/gdocs 2>/dev/null || true
          cat .gdocs/state.json 2>/dev/null
          echo PROBE-END
